# Serendipity Lab: models and retrieval config. LOCKED at Hour 2.
# Retrieval defaults (bottom) stay tunable until the Hour 14 gate. Everything else changes only via `amendments`.
version: 1

llm:
  provider: deepseek
  base_url: https://api.deepseek.com
  # DeepSeek also serves an Anthropic-format mirror at https://api.deepseek.com/anthropic.
  # Unverified for tool use / structured output. Until it is verified, use the OpenAI-format
  # base_url above. If it passes the gateway acceptance tests it becomes the cheaper swap,
  # because the adapter would keep its existing shape.
  api_key_env: DEEPSEEK_API_KEY
  base_model: deepseek-v4-pro
  # THINKING MODE MUST STAY DISABLED. DeepSeek defaults it to ON at effort "high".
  # Two consequences if it is left on: (1) temperature is silently ignored, so the
  # temperature: 0 below does nothing and the validation table stops being reproducible;
  # (2) the chain of thought blows the 20s hero budget.
  # Wire per format: {"thinking": {"type": "disabled"}}  or  {"reasoning": {"effort": "none"}}
  thinking:
    mode: disabled
  # Rule: abstractor and decomposer MUST use the same model. Both produce text that is embedded into
  # the same space as the corpus abstractions. A model mismatch is a silent quality bug.
  tasks:
    abstractor:
      model: deepseek-v4-pro
      temperature: 0            # determinism makes the cache and the validation table reproducible; drop if the API rejects it
      max_tokens: 600
      timeout_s: 45
      prompt_file: prompts/abstractor.md
      schema_file: config/schemas/abstraction.schema.json
    decomposer:                 # also used in rewrite mode (given a reviewer critique, produce better queries)
      model: deepseek-v4-pro
      temperature: 0
      max_tokens: 700
      timeout_s: 45
      prompt_file: prompts/decomposer.md
      schema_file: config/schemas/decomposer.schema.json      # written by Hour 6
    skeptic:                    # reviewer: keep/drop + reason + boundary conditions
      model: deepseek-v4-pro  # first thing to downgrade to deepseek-flash if latency breaks the 20s target
      temperature: 0.2
      max_tokens: 500
      timeout_s: 30
      prompt_file: prompts/skeptic.md
      schema_file: config/schemas/skeptic.schema.json         # written by Hour 6
    translator:                 # what-if + source_passage + mapping[] + reviewer_note
      model: deepseek-v4-pro
      temperature: 0.3
      max_tokens: 900
      timeout_s: 60
      prompt_file: prompts/translator.md
      schema_file: config/schemas/translator.schema.json      # written by Hour 6
  # prior_art: CUT (see docs/cut_list.md). No prompt, no schema, no API field.

  concurrency: 8                # global semaphore across all tasks; lower it first if you hit 429s
  retries:
    transport: 4                # timeouts, 429, 5xx; honor Retry-After
    validation: 2               # schema or JSON failures; error text is appended to the retry prompt
    backoff_base_s: 1.5
    backoff_max_s: 20
    jitter: true
  cache:
    backend: sqlite             # WAL mode; atomic; safe to kill mid-run and resume
    path: cache/llm_cache.sqlite
    # Superset of the planned key (paper_id, prompt_version, model). The prompt hash means editing a prompt
    # file WITHOUT bumping its version still cannot return a stale result.
    key_fields: [task, cache_id, prompt_sha256, model, schema_sha256]
    never_cache_failures: true
    cache_only_env: LLM_CACHE_ONLY    # =1: a cache miss raises instead of calling the API. Use on stage.

embedding:
  library: sentence-transformers
  model: BAAI/bge-base-en-v1.5  # local, free, no network dependency at demo time, 768-dim
  dim: 768
  normalize: true
  metric: cosine
  max_seq_length: 512
  batch_size: 32
  query_instruction: ""         # none. Matching is symmetric (abstraction to abstraction), so neither side gets a prefix.
  one_model_rule: true          # one model for queries and corpus; never mix
  assert_at_load: true          # store {model, dim, normalize} in Chroma collection metadata; refuse to load on mismatch

vector_store:
  engine: chromadb              # FAISS only above ~200k documents
  path: data/chroma
  collections:
    abstractions_problem:   { embeds: "functional_problem + constraints" }
    abstractions_mechanism: { embeds: "mechanism" }
    raw_abstracts:          { embeds: "title + raw abstract" }   # baseline only
  metadata_fields: [paper_id, title, year, field, source, doi]
  home_field_filter: { field: { "$nin": "home_fields" } }        # applied identically to ours AND the baseline

# --- Retrieval defaults: tunable until the Hour 14 gate ---
retrieval:
  # Each paper has TWO structural vectors. A query is compared with both. The user's problem should match
  # either a paper's own problem (same abstract problem) or its mechanism (a mechanism that offers what the user needs).
  structural_score: "max(cos(q, v_problem), cos(q, v_mechanism)), maximized over all queries in the run"
  record_matched_on: true       # 'problem' or 'mechanism'; shown in the inspector and reported in the table
  queries_per_run: [2, 4]       # decomposer output, plus the original abstraction
  k_per_query: 30
  candidates_to_review: 12
  max_loops: 2
  results_shown: 5
  drop_rule: "no source_passage AND no mapping => dropped, never shown"
  heresy:                       # derived, no extra model; replaces the separate Heresy Meter
    topical_distance: "1 - cos(raw_query_embedding, raw_abstract_embedding)"
    buckets: tertiles_of_candidate_pool   # low / medium / high; computed per run
  chaos_param: accepted_and_ignored       # slider is cut; API field kept so the frontend contract does not break

amendments:
  - date: 2026-10-17
    change: "llm provider anthropic -> deepseek; claude-sonnet-5-5 -> deepseek-v4-pro on all four tasks; added base_url and thinking.mode=disabled"
    reason: "Team moved off Anthropic. The swap was anticipated by llm_gateway_spec rule 10 (change models.yaml + one adapter file). Done before any case was run, so the validation re-run rule in validation_cases.yaml is not triggered. thinking.mode added because DeepSeek defaults thinking ON, which silently ignores temperature and blows the 20s hero budget."
